services:
  api:
    build: .
    command: uvicorn src.interfaces.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
  ui:
    build: .
    command: streamlit run src/interfaces/ui.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
