name: Basic checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3" "pytest>=8,<9"
      - name: Unit tests
        run: python -m pytest -q
      - name: Syntax check
        run: python -m compileall -q src tests
